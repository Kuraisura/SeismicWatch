// Top-level build file
plugins {
    // AGP 8.5.1+ aligns uncompressed native libraries (.so) to 16 KB in the APK by
    // default — required (alongside 16 KB-built libs) to run on Android 15+ 16 KB devices.
    id 'com.android.application' version '8.5.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
    // kotlinx.serialization compiler plugin — required by Supabase-kt's @Serializable
    // models. Version must match the Kotlin version above.
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.9.22' apply false
    // Firebase: processes google-services.json into resources at build time.
    id 'com.google.gms.google-services' version '4.4.1' apply false
}
