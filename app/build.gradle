plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
}

// Read per-machine secrets (Supabase URL + anon key) from local.properties, which is
// gitignored and never committed. Exposed below as BuildConfig fields so no secret is
// hardcoded in source. Missing keys fall back to "" so a fresh checkout still configures.
def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) { localPropsFile.withInputStream { localProps.load(it) } }

android {
    namespace 'com.gising'
    compileSdk 34

    defaultConfig {
        // Must match the Android package registered in the Firebase project
        // (see app/google-services.json → client/android_client_info/package_name).
        applicationId "com.kuraislerdev.gising"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        vectorDrawables {
            useSupportLibrary true
        }

        // Supabase config — sourced from local.properties (see top of file), surfaced as
        // BuildConfig.SUPABASE_URL / BuildConfig.SUPABASE_ANON_KEY. Use ONLY the publishable
        // (anon) key here; the service-role key must never ship in the app.
        buildConfigField "String", "SUPABASE_URL", "\"${localProps.getProperty("SUPABASE_URL", "")}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${localProps.getProperty("SUPABASE_ANON_KEY", "")}\""
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // Core library desugaring lets us use java.time (and other Java 8 APIs)
        // all the way down to Android 5.0 Lollipop (API 21).
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        jniLibs {
            // Store native libs uncompressed & page-aligned so the 16 KB-aligned
            // .so segments survive packaging (required for Android 15+ / Google Play).
            useLegacyPackaging = false
        }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.02.00')
    implementation composeBom

    // Java 8+ API desugaring (java.time, etc.) for Android 5.0 Lollipop support
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material3:material3-window-size-class'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'androidx.datastore:datastore-preferences:1.0.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    // Bridges Google/Firebase Task<T> to coroutines via .await()
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // Security — encrypted local database (SQLCipher) + Keystore-backed prefs
    // sqlcipher-android (NOT the EOL android-database-sqlcipher) ships 16 KB-page-aligned
    // native libs, required for Android 15+ / Google Play. Needs minSdk 23.
    implementation 'net.zetetic:sqlcipher-android:4.9.0@aar'
    implementation 'androidx.sqlite:sqlite-ktx:2.4.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Branded splash screen (official SplashScreen API, back-compat to API 21)
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // ── Firebase (backend for the Life360-style live family location) ────────────
    // 33.x requires minSdk 23 (which we now target). Don't drop minSdk below 23.
    implementation platform('com.google.firebase:firebase-bom:33.1.0')
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation 'com.google.firebase:firebase-messaging-ktx'
    // Profile photos are stored as compressed base64 in Firestore (no paid Cloud Storage plan);
    // see ProfileViewModel.encodeAvatar + the Coil data-URI mapper in SeismicApplication.
    // App Check — only genuine, untampered app instances may talk to Firebase.
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'
    implementation 'com.google.firebase:firebase-appcheck-debug'
    debugImplementation 'com.google.firebase:firebase-appcheck-debug'

    // Google Sign-In via Credential Manager (modern, replaces GoogleSignInClient)
    implementation 'androidx.credentials:credentials:1.2.2'
    implementation 'androidx.credentials:credentials-play-services-auth:1.2.2'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.0'

    // Maps — OpenStreetMap via MapLibre Native (open-source, no API key required).
    // Replaces the now-archived osmdroid; raster OSM tiles supplied by assets/maplibre_style.json.
    // 11.6.1 is the first release with corrected 16 KB page-aligned native libs (libmaplibre.so),
    // required for Android 15+ / Google Play. Stays on the OpenGL backend (13.x defaults to Vulkan),
    // so MapView/Style/GeoJsonSource/CircleLayer/SymbolLayer usage is unchanged.
    implementation 'org.maplibre.gl:android-sdk:11.6.1'
    implementation 'com.google.android.gms:play-services-location:21.1.0'

    // ── Emergency / SOS subsystem ────────────────────────────────────────────────
    // Home-screen Glance widget for one-tap SOS.
    implementation 'androidx.glance:glance-appwidget:1.1.0'
    // Nearby Connections — P2P SOS relay over BLE/Wi-Fi when towers are down.
    implementation 'com.google.android.gms:play-services-nearby:19.3.0'

    // Notifications
    implementation 'androidx.core:core-ktx:1.12.0'

    // Fonts
    implementation 'androidx.compose.ui:ui-text-google-fonts'

    // Image loading (Compose) — renders remote profile photos from Firebase Storage URLs.
    implementation 'io.coil-kt:coil-compose:2.6.0'

    // ── Supabase (live earthquake table: queries + 24/7 realtime INSERT alerts) ──
    // BOM aligns all supabase-kt module versions. postgrest-kt = DB queries,
    // realtime-kt = WebSocket change stream.
    implementation platform('io.github.jan-tennert.supabase:bom:2.4.3')
    implementation 'io.github.jan-tennert.supabase:postgrest-kt'
    implementation 'io.github.jan-tennert.supabase:realtime-kt'
    // Ktor engine for Supabase's network calls. MUST be okhttp/cio/java — the
    // 'android' engine does NOT support WebSockets, so Realtime would never connect.
    implementation 'io.ktor:ktor-client-okhttp:2.3.11'
    // JSON runtime for the @Serializable models decoded from Postgrest/Realtime.
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation composeBom
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
